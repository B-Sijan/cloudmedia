<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudMedia - Share Your Media</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .upload-section {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid #0f3460;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .upload-section h2,
        .gallery-section h2 {
            font-size: 22px;
            margin-bottom: 24px;
            color: #e94560;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #0f0f1a;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e94560;
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .file-upload-area {
            border: 2px dashed #0f3460;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            background: #0f0f1a;
        }

        .file-upload-area:hover {
            border-color: #e94560;
            background: #1a1a2e;
        }

        .file-upload-area input { display: none; }
        .file-upload-area p { color: #a0a0b0; margin-top: 10px; }
        .file-upload-area .icon { font-size: 48px; }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73652);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .status-msg.success {
            background: #1a3a2e;
            color: #4caf50;
            border: 1px solid #4caf50;
            display: block;
        }

        .status-msg.error {
            background: #3a1a1a;
            color: #e94560;
            border: 1px solid #e94560;
            display: block;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .media-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #0f3460;
        }

        .media-card img,
        .media-card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .media-card-body { padding: 16px; }

        .media-card-body h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .media-card-body p {
            font-size: 13px;
            color: #a0a0b0;
            margin-bottom: 12px;
        }

        .media-type-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .badge-image { background: #1a3a4a; color: #4fc3f7; }
        .badge-video { background: #3a1a3a; color: #ce93d8; }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit,
        .btn-delete {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-edit {
            background: #0f3460;
            color: #fff;
            border: none;
        }

        .btn-delete {
            background: #3a1a1a;
            color: #e94560;
            border: 1px solid #e94560;
        }

        .empty-state,
        .loading {
            text-align: center;
            padding: 60px;
            color: #a0a0b0;
            grid-column: 1/-1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #0f3460;
        }

        .modal h3 {
            margin-bottom: 24px;
            color: #e94560;
            font-size: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-cancel,
        .btn-save {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-cancel {
            background: transparent;
            color: #a0a0b0;
            border: 1px solid #0f3460;
        }

        .btn-save {
            background: linear-gradient(135deg, #e94560, #c73652);
            color: white;
            border: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<header>
    <h1>☁️ CloudMedia</h1>
    <span style="color:#a0a0b0;font-size:14px;">Serverless Media Sharing Platform</span>
</header>

<div class="container">
    <div class="upload-section">
        <h2>📤 Upload Media</h2>

        <div class="form-group">
            <label>Title</label>
            <input type="text" id="titleInput" placeholder="Enter a title for your media...">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="descInput" placeholder="Add a description..."></textarea>
        </div>

        <div class="form-group">
            <label>Media File</label>
            <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="image/*,video/*" onchange="handleFileSelect(this)">
                <div class="icon">📁</div>
                <p id="fileLabel">Click to select an image or video</p>
            </div>
        </div>

        <button class="btn btn-primary" onclick="uploadMedia()" id="uploadBtn">
            Upload Media
        </button>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="gallery-section">
        <h2>🖼️ Media Gallery</h2>
        <div class="gallery-grid" id="galleryGrid">
            <div class="loading">Loading media...</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3>✏️ Edit Asset</h3>

        <div class="form-group">
            <label>Title</label>
            <input type="text" id="editTitle">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="editDesc"></textarea>
        </div>

        <input type="hidden" id="editAssetId">

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://cloudmedia-functions-ayfvashxc9cxcffu.switzerlandnorth-01.azurewebsites.net/api';

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function handleFileSelect(input) {
        const file = input.files[0];

        if (file) {
            document.getElementById('fileLabel').textContent = `Selected: ${file.name}`;
        }
    }

    function showStatus(message, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = message;
        el.className = `status-msg ${type}`;
    }

    async function uploadMedia() {
        const title = document.getElementById('titleInput').value.trim();
        const description = document.getElementById('descInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        const btn = document.getElementById('uploadBtn');

        if (!title || !file) {
            showStatus('Please provide a title and select a file.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Uploading...';

        const formData = new FormData();
        formData.append('title', title);
        formData.append('description', description);
        formData.append('userId', '1');
        formData.append('file', file);

        try {
            const response = await fetch(`${API_BASE}/uploadAsset`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json().catch(() => null);

            if (!response.ok || !data || data.success === false) {
                throw new Error(data?.error || 'Upload failed');
            }

            showStatus('✅ Media uploaded successfully!', 'success');

            document.getElementById('titleInput').value = '';
            document.getElementById('descInput').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('fileLabel').textContent = 'Click to select an image or video';

            await loadGallery();

        } catch (err) {
            showStatus(`❌ Upload failed: ${err.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Upload Media';
        }
    }

    async function loadGallery() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '<div class="loading">Loading media...</div>';

        try {
            const response = await fetch(`${API_BASE}/getAssets`);
            const data = await response.json();

            const assets = Array.isArray(data)
                ? data
                : Array.isArray(data.assets)
                    ? data.assets
                    : [];

            if (!response.ok || data.success === false) {
                throw new Error(data.error || 'Failed to load assets');
            }

            if (assets.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No media uploaded yet. Be the first to share!</p>
                    </div>`;
                return;
            }

            grid.innerHTML = assets.map(asset => {
                const assetId = asset.AssetId || asset.Id;
                const title = escapeHtml(asset.Title);
                const description = escapeHtml(asset.Description || 'No description');
                const blobUrl = escapeHtml(asset.BlobUrl);
                const mediaType = asset.MediaType || '';
                const isVideo = mediaType.startsWith('video');

                const mediaEl = isVideo
                    ? `<video src="${blobUrl}" controls></video>`
                    : `<img src="${blobUrl}" alt="${title}">`;

                const badge = isVideo
                    ? `<span class="media-type-badge badge-video">Video</span>`
                    : `<span class="media-type-badge badge-image">Image</span>`;

                return `
                    <div class="media-card">
                        ${mediaEl}
                        <div class="media-card-body">
                            ${badge}
                            <h3>${title}</h3>
                            <p>${description}</p>
                            <div class="card-actions">
                                <button class="btn-edit" onclick="openEditModal(${assetId})">
                                    ✏️ Edit
                                </button>
                                <button class="btn-delete" onclick="deleteAsset(${assetId})">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            window.currentAssets = assets;

        } catch (err) {
            grid.innerHTML = `
                <div class="empty-state">
                    <p>❌ Failed to load media: ${escapeHtml(err.message)}</p>
                </div>`;
        }
    }

    async function deleteAsset(id) {
        if (!id) {
            alert('Invalid asset ID.');
            return;
        }

        if (!confirm('Are you sure you want to delete this asset?')) return;

        try {
            const response = await fetch(`${API_BASE}/deleteAsset/${id}`, {
                method: 'DELETE'
            });

            const data = await response.json().catch(() => null);

            if (!response.ok || data?.success === false) {
                throw new Error(data?.error || 'Failed to delete asset');
            }

            await loadGallery();

        } catch (err) {
            alert(`Error: ${err.message}`);
        }
    }

    function openEditModal(id) {
        const asset = (window.currentAssets || []).find(a => {
            return String(a.AssetId || a.Id) === String(id);
        });

        if (!asset) {
            alert('Asset not found.');
            return;
        }

        document.getElementById('editAssetId').value = asset.AssetId || asset.Id;
        document.getElementById('editTitle').value = asset.Title || '';
        document.getElementById('editDesc').value = asset.Description || '';
        document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    async function saveEdit() {
        const id = document.getElementById('editAssetId').value;
        const title = document.getElementById('editTitle').value.trim();
        const description = document.getElementById('editDesc').value.trim();

        if (!title) {
            alert('Title is required.');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/updateAsset/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title,
                    description
                })
            });

            const data = await response.json().catch(() => null);

            if (!response.ok || data?.success === false) {
                throw new Error(data?.error || 'Failed to update asset');
            }

            closeModal();
            await loadGallery();

        } catch (err) {
            alert(`Error: ${err.message}`);
        }
    }

    loadGallery();
</script>

</body>
</html>
